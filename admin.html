<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Relax Garments - Admin Panel</title>

<!-- SUPABASE: MUST LOAD BEFORE ADMIN CODE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f6f8;
  color:#222;
}
header{
  background:#111;
  color:#fff;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
header h1{margin:0;font-size:22px}
.container{max-width:1100px;margin:auto;padding:20px}
.card{
  background:#fff;
  border-radius:14px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}
h2{margin-top:0}
input,select,textarea{
  width:100%;
  padding:12px;
  margin:7px 0 12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}
button{
  border:0;
  border-radius:8px;
  padding:11px 17px;
  cursor:pointer;
  font-weight:bold;
  margin:4px;
}
.primary{background:#111;color:#fff}
.danger{background:#c62828;color:#fff}
.secondary{background:#e9ecef;color:#111}
.success{background:#198754;color:#fff}
.hidden{display:none!important}
.status{
  padding:12px;
  border-radius:8px;
  margin-bottom:15px;
  background:#fff3cd;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:15px;
}
.product{
  border:1px solid #ddd;
  border-radius:12px;
  padding:12px;
  background:#fff;
}
.product img{
  width:100%;
  height:240px;
  object-fit:contain;
  background:#f5f5f5;
  border-radius:8px;
}
.price{font-size:20px;font-weight:bold}
.old{
  text-decoration:line-through;
  color:#888;
  margin-left:8px;
}
.small{font-size:13px;color:#666}
.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
@media(max-width:600px){
  .row{grid-template-columns:1fr}
  header{padding:14px}
  header h1{font-size:18px}
}
#loginBox{
  max-width:430px;
  margin:60px auto;
}
</style>
</head>

<body>

<header>
  <h1>RELAX GARMENTS — ADMIN</h1>
  <button id="logoutBtn" class="danger hidden">Logout</button>
</header>

<div class="container">

  <!-- CONNECTION STATUS -->
  <div id="connectionStatus" class="status">
    Checking Supabase connection…
  </div>

  <!-- LOGIN -->
  <section id="loginBox" class="card hidden">
    <h2>Admin Login</h2>

    <label>Email</label>
    <input id="email" type="email" placeholder="Admin email">

    <label>Password</label>
    <input id="password" type="password" placeholder="Password">

    <button class="primary" onclick="login()">Login</button>

    <p id="loginMsg" class="small"></p>
  </section>

  <!-- ADMIN AREA -->
  <main id="adminArea" class="hidden">

    <!-- PRODUCT FORM -->
    <section class="card">
      <h2 id="formTitle">Add New Product</h2>

      <input type="hidden" id="productId">

      <div class="row">
        <div>
          <label>Product Name</label>
          <input id="name" placeholder="Example: Premium Cotton T-Shirt">
        </div>

        <div>
          <label>Brand</label>
          <select id="brand">
            <option value="JACK">JACK</option>
            <option value="GETZED">GETZED</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div>
          <label>Sale Price</label>
          <input id="price" type="number" placeholder="999">
        </div>

        <div>
          <label>Old Price</label>
          <input id="oldPrice" type="number" placeholder="1499">
        </div>
      </div>

      <label>Product Image</label>
      <input id="imageFile" type="file" accept="image/*">

      <label>Image URL (optional)</label>
      <input id="imageUrl" placeholder="https://...">

      <label>Description</label>
      <textarea id="description" rows="4" placeholder="Product description"></textarea>

      <button class="primary" onclick="saveProduct()">Save Product</button>
      <button class="secondary" onclick="resetForm()">Clear</button>

      <p id="productMsg" class="small"></p>
    </section>

    <!-- PRODUCTS -->
    <section class="card">
      <h2>All Products</h2>
      <button class="secondary" onclick="loadProducts()">Refresh Products</button>
      <div id="productsGrid" class="grid"></div>
    </section>

    <!-- CONTACT / HELP -->
    <section class="card">
      <h2>Contact & Help Settings</h2>

      <label>WhatsApp Number</label>
      <input id="whatsapp" placeholder="91XXXXXXXXXX">

      <label>WhatsApp Text</label>
      <input id="whatsappText" placeholder="Contact us for orders.">

      <label>Support</label>
      <input id="support" placeholder="Support contact">

      <label>Support Text</label>
      <input id="supportText" placeholder="For product and order help.">

      <label>Delivery</label>
      <input id="delivery" value="India">

      <label>Delivery Text</label>
      <input id="deliveryText" placeholder="Delivery available across India.">

      <label>Order Help</label>
      <textarea id="orderHelp" rows="3"></textarea>

      <label>Price Help</label>
      <textarea id="priceHelp" rows="3"></textarea>

      <label>Bulk Help</label>
      <textarea id="bulkHelp" rows="3"></textarea>

      <button class="success" onclick="saveSettings()">Save Contact & Help</button>

      <p id="settingsMsg" class="small"></p>
    </section>

  </main>
</div>

<script>
/* =========================================================
   RELAX GARMENTS ADMIN
   Supabase library + config are loaded ABOVE this script.
   ========================================================= */

let sb = null;
let products = [];

const $ = id => document.getElementById(id);

function money(n){
  return "₹" + Number(n || 0).toLocaleString("en-IN");
}

function discount(p){
  if(p.old_price && Number(p.old_price) > Number(p.price)){
    return Math.round(
      (1 - Number(p.price)/Number(p.old_price))*100
    );
  }
  return 0;
}

/* ---------- SUPABASE INITIALIZATION ---------- */

async function initSupabase(){

  try{

    if(!window.supabase){
      throw new Error("Supabase library did not load.");
    }

    if(!window.SUPABASE_URL){
      throw new Error("SUPABASE_URL missing.");
    }

    if(!window.SUPABASE_ANON_KEY){
      throw new Error("SUPABASE_ANON_KEY missing.");
    }

    if(
      window.SUPABASE_URL.includes("PASTE_") ||
      window.SUPABASE_ANON_KEY.includes("PASTE_")
    ){
      throw new Error("Supabase config still contains placeholder.");
    }

    sb = window.supabase.createClient(
      window.SUPABASE_URL,
      window.SUPABASE_ANON_KEY
    );

    /* Real connection test */
    const {error} = await sb
      .from("products")
      .select("id")
      .limit(1);

    /*
      PGRST116 / empty result is NOT a connection failure.
      Permission errors are displayed clearly.
    */

    if(error){
      $("connectionStatus").style.background="#f8d7da";
      $("connectionStatus").textContent =
        "Supabase connected, but database access has an error: " +
        error.message;
      $("loginBox").classList.remove("hidden");
      return;
    }

    $("connectionStatus").style.background="#d1e7dd";
    $("connectionStatus").textContent =
      "✓ Supabase connected successfully.";

    checkSession();

  }catch(err){

    console.error(err);

    $("connectionStatus").style.background="#f8d7da";
    $("connectionStatus").textContent =
      "Supabase connection failed: " + err.message;

    $("loginBox").classList.remove("hidden");
  }
}

/* ---------- AUTH ---------- */

async function checkSession(){

  const {data,error} = await sb.auth.getSession();

  if(error){
    $("loginBox").classList.remove("hidden");
    return;
  }

  if(data.session){
    showAdmin();
  }else{
    $("loginBox").classList.remove("hidden");
  }
}

async function login(){

  const email = $("email").value.trim();
  const password = $("password").value;

  if(!email || !password){
    $("loginMsg").textContent="Please enter email and password.";
    return;
  }

  $("loginMsg").textContent="Logging in…";

  const {data,error} = await sb.auth.signInWithPassword({
    email:email,
    password:password
  });

  if(error){
    $("loginMsg").textContent="Login failed: "+error.message;
    return;
  }

  $("loginMsg").textContent="Login successful.";

  showAdmin();
}

async function logout(){

  await sb.auth.signOut();

  $("adminArea").classList.add("hidden");
  $("logoutBtn").classList.add("hidden");
  $("loginBox").classList.remove("hidden");
}

$("logoutBtn").addEventListener("click",logout);

function showAdmin(){

  $("loginBox").classList.add("hidden");
  $("adminArea").classList.remove("hidden");
  $("logoutBtn").classList.remove("hidden");

  loadProducts();
  loadSettings();
}

/* ---------- PRODUCTS ---------- */

async function loadProducts(){

  if(!sb)return;

  const grid=$("productsGrid");

  grid.innerHTML="<p>Loading products…</p>";

  const {data,error}=await sb
    .from("products")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    grid.innerHTML=
      "<p>Could not load products: "+
      escapeHtml(error.message)+
      "</p>";
    return;
  }

  products=data || [];

  if(!products.length){
    grid.innerHTML="<p>No products found.</p>";
    return;
  }

  grid.innerHTML=products.map(productHTML).join("");
}

function productHTML(p){

  const d=discount(p);

  return `
    <article class="product">

      <img
        src="${escapeAttr(p.image_url || "")}"
        alt="${escapeAttr(p.name || "")}"
      >

      <p class="small">${escapeHtml(p.brand || "")}</p>

      <h3>${escapeHtml(p.name || "")}</h3>

      <div>
        <span class="price">${money(p.price)}</span>

        ${
          p.old_price
          ? `<span class="old">${money(p.old_price)}</span>`
          : ""
        }

        ${
          d
          ? `<span class="small"> ${d}% OFF</span>`
          : ""
        }
      </div>

      <p class="small">
        ${
          p.created_at
          ? "Added: "+new Date(p.created_at).toLocaleDateString("en-IN")
          : ""
        }
      </p>

      <button
        class="primary"
        onclick="editProduct('${p.id}')">
        Edit
      </button>

      <button
        class="danger"
        onclick="deleteProduct('${p.id}')">
        Delete
      </button>

    </article>
  `;
}

/* ---------- SAVE PRODUCT ---------- */

async function saveProduct(){

  if(!sb){
    $("productMsg").textContent="Supabase is not connected.";
    return;
  }

  const id=$("productId").value;
  const name=$("name").value.trim();
  const brand=$("brand").value;
  const price=Number($("price").value);
  const oldPrice=
    $("oldPrice").value
    ? Number($("oldPrice").value)
    : null;
  const description=$("description").value.trim();
  const imageUrl=$("imageUrl").value.trim();
  const file=$("imageFile").files[0];

  if(!name){
    $("productMsg").textContent="Product name is required.";
    return;
  }

  if(!price){
    $("productMsg").textContent="Sale price is required.";
    return;
  }

  $("productMsg").textContent="Saving…";

  let finalImage=imageUrl;

  /* Upload image to Supabase Storage */
  if(file){

    try{

      const safeName=
        file.name
        .replace(/[^a-zA-Z0-9._-]/g,"-");

      const path=
        Date.now()+"-"+safeName;

      const {error:uploadError}=await sb
        .storage
        .from("product-images")
        .upload(path,file,{
          upsert:false
        });

      if(uploadError){
        $("productMsg").textContent=
          "Image upload failed: "+uploadError.message;
        return;
      }

      const {data:urlData}=sb
        .storage
        .from("product-images")
        .getPublicUrl(path);

      finalImage=urlData.publicUrl;

    }catch(err){

      $("productMsg").textContent=
        "Image upload error: "+err.message;
      return;
    }
  }

  if(!finalImage){
    $("productMsg").textContent=
      "Please select an image or enter an image URL.";
    return;
  }

  const record={
    name:name,
    brand:brand,
    image_url:finalImage,
    price:price,
    old_price:oldPrice,
    description:description
  };

  let result;

  if(id){

    result=await sb
      .from("products")
      .update(record)
      .eq("id",id);

  }else{

    result=await sb
      .from("products")
      .insert(record);
  }

  if(result.error){

    $("productMsg").textContent=
      "Save failed: "+result.error.message;
    return;
  }

  $("productMsg").textContent=
    id ? "✓ Product updated." : "✓ Product added.";

  resetForm();
  loadProducts();
}

/* ---------- EDIT ---------- */

function editProduct(id){

  const p=products.find(x=>x.id===id);

  if(!p)return;

  $("productId").value=p.id;
  $("name").value=p.name || "";
  $("brand").value=p.brand || "JACK";
  $("price").value=p.price || "";
  $("oldPrice").value=p.old_price || "";
  $("imageUrl").value=p.image_url || "";
  $("description").value=p.description || "";

  $("formTitle").textContent="Edit Product";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

/* ---------- DELETE ---------- */

async function deleteProduct(id){

  if(!confirm("Delete this product permanently?")){
    return;
  }

  const {error}=await sb
    .from("products")
    .delete()
    .eq("id",id);

  if(error){
    alert("Delete failed: "+error.message);
    return;
  }

  loadProducts();
}

/* ---------- RESET ---------- */

function resetForm(){

  $("productId").value="";
  $("name").value="";
  $("brand").value="JACK";
  $("price").value="";
  $("oldPrice").value="";
  $("imageUrl").value="";
  $("imageFile").value="";
  $("description").value="";
  $("formTitle").textContent="Add New Product";
}

/* ---------- SETTINGS ---------- */

async function loadSettings(){

  const {data,error}=await sb
    .from("site_settings")
    .select("*")
    .eq("id",1)
    .maybeSingle();

  if(error){
    $("settingsMsg").textContent=
      "Settings table error: "+error.message;
    return;
  }

  if(!data)return;

  $("whatsapp").value=data.whatsapp || "";
  $("whatsappText").value=data.whatsapp_text || "";
  $("support").value=data.support || "";
  $("supportText").value=data.support_text || "";
  $("delivery").value=data.delivery || "India";
  $("deliveryText").value=data.delivery_text || "";
  $("orderHelp").value=data.order_help || "";
  $("priceHelp").value=data.price_help || "";
  $("bulkHelp").value=data.bulk_help || "";
}

async function saveSettings(){

  const record={
    id:1,
    whatsapp:$("whatsapp").value.trim(),
    whatsapp_text:$("whatsappText").value.trim(),
    support:$("support").value.trim(),
    support_text:$("supportText").value.trim(),
    delivery:$("delivery").value.trim(),
    delivery_text:$("deliveryText").value.trim(),
    order_help:$("orderHelp").value.trim(),
    price_help:$("priceHelp").value.trim(),
    bulk_help:$("bulkHelp").value.trim(),
    updated_at:new Date().toISOString()
  };

  $("settingsMsg").textContent="Saving…";

  const {error}=await sb
    .from("site_settings")
    .upsert(record,{onConflict:"id"});

  if(error){

    $("settingsMsg").textContent=
      "Settings save failed: "+error.message;

    return;
  }

  $("settingsMsg").textContent=
    "✓ Contact & Help settings saved.";
}

/* ---------- SECURITY HELPERS ---------- */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeAttr(value){
  return escapeHtml(value);
}

/* ---------- START ---------- */

document.addEventListener(
  "DOMContentLoaded",
  initSupabase
);
</script>

</body>
</html>
