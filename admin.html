<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel | Relax Garments</title><link rel="stylesheet" href="style.css"></head><body><header class="header"><div class="container nav"><a href="index.html"><img class="logo" src="website-logo.png" alt="Relax Garments"></a><nav class="menu"><a href="index.html">HOME</a><a href="brands.html">BRANDS</a><a href="products.html">PRODUCTS</a><a href="contact.html">CONTACT</a><a href="help.html">HELP</a></nav></div></header><main class="admin-wrap"><div class="container"><h1>Admin Panel</h1><p>Add products, edit products and set discounts. This static version saves changes in the current browser.</p><div class="admin-card"><h2>Add / Edit Product</h2><form id="form"><input type="hidden" id="id"><div class="field"><label>Product Name</label><input id="name" required></div><div class="field"><label>Brand</label><select id="brand"><option>JACK</option><option>GETZED</option></select></div><div class="field"><label>Image filename</label><input id="image" placeholder="product-1.png" required></div><div class="field"><label>Sale Price</label><input id="price" type="number" required></div><div class="field"><label>Old Price</label><input id="oldPrice" type="number"></div><button class="add success">SAVE PRODUCT</button><button type="button" class="add" onclick="resetForm()">CLEAR</button></form></div><div class="admin-card"><h2>Products / Discounts</h2><table class="admin-table"><thead><tr><th>Product</th><th>Brand</th><th>Price</th><th>Discount</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>let products=[];function save(){localStorage.setItem("rg_products",JSON.stringify(products))}function render(){rows.innerHTML=products.map(p=>`<tr><td>${p.name}</td><td>${p.brand}</td><td>${money(p.price)}</td><td>${discount(p)}%</td><td><button class="add" onclick="editP(${p.id})">EDIT</button><button class="add danger" onclick="delP(${p.id})">DELETE</button></td></tr>`).join("")}function resetForm(){form.reset();id.value=""}function editP(x){let p=products.find(a=>a.id==x);id.value=p.id;name.value=p.name;brand.value=p.brand;image.value=p.image;price.value=p.price;oldPrice.value=p.oldPrice||"";scrollTo(0,0)}function delP(x){products=products.filter(a=>a.id!=x);save();render()}form.onsubmit=e=>{e.preventDefault();let p={id:id.value?Number(id.value):Date.now(),name:name.value,brand:brand.value,image:image.value,price:Number(price.value),oldPrice:Number(oldPrice.value)||null};let i=products.findIndex(a=>a.id===p.id);if(i>=0)products[i]=p;else products.push(p);save();render();resetForm()};getProducts().then(x=>{products=x;render()});</script><footer class="footer"><div class="container footer-inner"><div><b>RELAX GARMENTS</b><br><small>JACK & GETZED — Premium Fashion</small></div><small>© 2026 Relax Garments</small></div></footer><div id="toast" class="toast"></div><script src="common.js"></script></body></html>
