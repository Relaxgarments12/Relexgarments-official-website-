<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Products | Relax Garments</title>
<link rel="stylesheet" href="style.css">
<style>
.products-toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:0 0 28px}
.filter-btn{border:1px solid #222;background:#fff;color:#111;padding:10px 18px;border-radius:5px;font-size:11px;font-weight:800;letter-spacing:1px;cursor:pointer}
.filter-btn.active,.filter-btn:hover{background:#111;color:#fff}
.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.pCard{background:#fff;border:1px solid #e5e5e5;border-radius:12px;overflow:hidden;box-shadow:0 5px 18px rgba(0,0,0,.05)}
.pGallery{position:relative;background:#f3f3f3;overflow:hidden}
.pGallery img{width:100%;height:360px;display:block;object-fit:cover}
.pDots{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:5px}
.pDots i{width:6px;height:6px;border-radius:50%;background:#fff;border:1px solid #222;opacity:.9}
.pDots i.on{background:#111}
.pArrow{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:50%;background:rgba(255,255,255,.85);font-size:18px;cursor:pointer}
.pPrev{left:8px}.pNext{right:8px}
.pBody{padding:14px}
.pBrand{font-size:9px;letter-spacing:2px;color:#777;font-weight:800;margin-bottom:6px}
.pName{font-size:16px;font-weight:800;margin-bottom:8px}
.priceRow{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.priceNow{font-weight:900;font-size:16px}.priceOld{text-decoration:line-through;color:#999;font-size:12px}.discount{font-size:11px;font-weight:800}
.actionRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actionBtn{padding:11px 8px;border-radius:5px;border:1px solid #111;background:#111;color:#fff;font-size:10px;font-weight:800;letter-spacing:.7px;cursor:pointer}
.actionBtn.buy{background:#fff;color:#111}
.emptyP{text-align:center;color:#777;padding:45px 10px;grid-column:1/-1}
.cartBar{position:fixed;right:15px;bottom:15px;z-index:20;background:#111;color:#fff;border-radius:25px;padding:12px 17px;font-size:11px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer}
@media(max-width:800px){.product-grid{grid-template-columns:repeat(2,1fr);gap:12px}.pGallery img{height:280px}.pName{font-size:14px}}
@media(max-width:500px){.product-grid{grid-template-columns:1fr 1fr}.pGallery img{height:250px}.pBody{padding:11px}.actionRow{grid-template-columns:1fr}.actionBtn{padding:9px 5px}}
</style>
</head>
<body>
<header class="header"><div class="container nav">
<a href="index.html"><img class="logo" src="website-logo.png" alt="Relax Garments"></a>
<nav class="menu"><a href="index.html">HOME</a><a href="brands.html">BRANDS</a><a href="products.html">PRODUCTS</a><a href="contact.html">CONTACT</a><a href="help.html">HELP</a></nav>
</div></header>

<main>
<section class="page-head"><div class="container"><h1>Products</h1><p>Premium T-shirts with live price, discount and Add to Cart.</p></div></section>
<section class="section"><div class="container">
<div class="products-toolbar">
<button class="filter-btn active" data-brand="ALL">ALL PRODUCTS</button>
<button class="filter-btn" data-brand="JACK">JACK</button>
<button class="filter-btn" data-brand="GETZED">GETZED</button>
</div>
<div class="product-grid" id="grid"><div class="emptyP">Loading products...</div></div>
</div></section>
</main>

<footer class="footer"><div class="container footer-inner"><div><b>RELAX GARMENTS</b><br><small>JACK &amp; GETZED — Premium Fashion</small></div><small>© 2026 Relax Garments</small></div></footer>
<div class="cartBar" id="cartBar">CART (0)</div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
let products=[], currentBrand='ALL';
const imgCols=['image_url','image2_url','image3_url','image4_url','image5_url','image6_url'];

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function val(p,keys){for(const k of keys){if(p[k]!==undefined&&p[k]!==null&&String(p[k]).trim()!=='')return p[k]}return ''}
function nameOf(p){return val(p,['name','product_name','item_name','item','title'])||'Premium T-Shirt'}
function brandOf(p){return String(val(p,['brand','brand_name','category'])||'').toUpperCase()}
function priceOf(p){return val(p,['price','sale_price','selling_price','offer_price'])}
function oldOf(p){return val(p,['old_price','mrp','original_price','regular_price'])}
function discOf(p){return val(p,['discount','discount_percent','discount_percentage'])}
function imagesOf(p){return imgCols.map(k=>p[k]).filter(x=>x&&String(x).trim())}
function toast(t){const x=document.getElementById('toast');if(x){x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}}

function cart(){
 try{return JSON.parse(localStorage.getItem('relax_cart')||'[]')}catch(e){return []}
}
function saveCart(c){localStorage.setItem('relax_cart',JSON.stringify(c));updateCart()}
function updateCart(){document.getElementById('cartBar').textContent='CART ('+cart().reduce((s,x)=>s+(Number(x.qty)||1),0)+')'}

function addCart(p){
 const c=cart(), key=String(p.id??nameOf(p));
 const found=c.find(x=>String(x.id??x.name)===key);
 if(found) found.qty=(Number(found.qty)||1)+1;
 else c.push({id:p.id,name:nameOf(p),brand:brandOf(p),price:priceOf(p),qty:1});
 saveCart(c); toast('Added to cart');
}
function buyNow(p){
 addCart(p);
 window.location.href='contact.html';
}

function card(p,index){
 const imgs=imagesOf(p), first=imgs[0]||'';
 const id='gal_'+index;
 const nm=nameOf(p), br=brandOf(p), pr=priceOf(p), old=oldOf(p), dc=discOf(p);
 return `<article class="pCard" onclick="openProduct(event, ${JSON.stringify(String(p.id ?? ""))})">
 <div class="pGallery" id="${id}" data-i="0" data-images='${esc(JSON.stringify(imgs))}'>
   ${first?`<img src="${esc(first)}" alt="${esc(nm)}" loading="lazy">`:`<div style="height:360px"></div>`}
   ${imgs.length>1?`<button class="pArrow pPrev" onclick="moveImg('${id}',-1)">‹</button><button class="pArrow pNext" onclick="moveImg('${id}',1)">›</button>
   <div class="pDots">${imgs.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('')}</div>`:''}
 </div>
 <div class="pBody">
   ${br?`<div class="pBrand">${esc(br)}</div>`:''}
   <div class="pName">${esc(nm)}</div>
   <div class="priceRow">${pr?`<span class="priceNow">₹${esc(pr)}</span>`:''}${old?`<span class="priceOld">₹${esc(old)}</span>`:''}${dc?`<span class="discount">${esc(dc)}% OFF</span>`:''}</div>
   <div class="actionRow">
    <button class="actionBtn" onclick='addCart(${JSON.stringify(p).replace(/'/g,"&#39;")})'>ADD TO CART</button>
    <button class="actionBtn buy" onclick='buyNow(${JSON.stringify(p).replace(/'/g,"&#39;")})'>BUY NOW</button>
   </div>
 </div></article>`;
}
function openProduct(e,id){if(e.target.closest('button'))return;if(id)location.href='product.html?id='+encodeURIComponent(id)}
function moveImg(id,dir){
 const g=document.getElementById(id);if(!g)return;
 let imgs=[];try{imgs=JSON.parse(g.dataset.images||'[]')}catch(e){}
 if(imgs.length<2)return;
 let i=Number(g.dataset.i)||0;i=(i+dir+imgs.length)%imgs.length;g.dataset.i=i;
 g.querySelector('img').src=imgs[i];
 [...g.querySelectorAll('.pDots i')].forEach((d,j)=>d.classList.toggle('on',j===i));
}
function render(){
 const list=currentBrand==='ALL'?products:products.filter(p=>brandOf(p)===currentBrand);
 document.getElementById('grid').innerHTML=list.length?list.map(card).join(''):'<div class="emptyP">No products found for this brand.</div>';
}
async function load(){
 try{
  const {data,error}=await sb.from('products').select('*').order('created_at',{ascending:false});
  if(error)throw error;
  products=data||[];render();
 }catch(e){
  console.error(e);document.getElementById('grid').innerHTML='<div class="emptyP">Products could not be loaded. Please refresh.</div>';
 }
}
document.querySelectorAll('.filter-btn').forEach(b=>b.addEventListener('click',()=>{
 document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));
 b.classList.add('active');currentBrand=b.dataset.brand;render();
}));
document.getElementById('cartBar').onclick=()=>{const c=cart();toast(c.length?'Cart has '+c.length+' product(s)':'Cart is empty')};
updateCart();load();
</script>
</body>
</html>
