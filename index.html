<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JACK & GETZED | Relaxgarments</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial, sans-serif;
}

body{
  background:#f5f5f5;
  color:#111;
}

/* HEADER */
header{
  background:#111;
  color:white;
  padding:18px 20px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:25px;
  font-weight:bold;
  letter-spacing:3px;
}

nav{
  margin-top:10px;
}

nav a{
  color:white;
  text-decoration:none;
  margin:0 12px;
  font-size:14px;
}

/* HERO */
.hero{
  background:white;
  text-align:center;
  padding:55px 20px;
}

.hero h1{
  font-size:34px;
  margin-bottom:12px;
}

.hero p{
  color:#666;
  margin-bottom:22px;
}

.btn{
  display:inline-block;
  background:#111;
  color:white;
  padding:13px 25px;
  border-radius:5px;
  text-decoration:none;
}

/* PRODUCTS */
.collection{
  padding:40px 15px;
  max-width:1200px;
  margin:auto;
}

.collection h2{
  text-align:center;
  margin-bottom:30px;
  font-size:25px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:25px;
}

.product{
  background:white;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 3px 15px rgba(0,0,0,.10);
}

.product img{
  width:100%;
  display:block;
  height:auto;
}

.product-info{
  padding:18px;
}

.product-info h3{
  font-size:20px;
  margin-bottom:8px;
}

.product-info p{
  color:#555;
  line-height:1.6;
  font-size:14px;
}

.product-btn{
  display:inline-block;
  margin-top:15px;
  background:#111;
  color:#fff;
  padding:10px 18px;
  border-radius:5px;
  text-decoration:none;
}

/* FOOTER */
footer{
  margin-top:40px;
  background:#111;
  color:white;
  text-align:center;
  padding:25px;
  font-size:13px;
}

@media(max-width:600px){
  .hero h1{
    font-size:28px;
  }

  .logo{
    font-size:21px;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
  <div class="logo">RELAXGARMENTS</div>

  <nav>
    <a href="#home">Home</a>
    <a href="#jack">JACK</a>
    <a href="#getzed">GETZED</a>
    <a href="#contact">Contact</a>
  </nav>
</header>


<!-- HOME -->
<section class="hero" id="home">

  <h1>JACK & GETZED</h1>

  <p>
    Premium Fashion Collection
  </p>

  <a class="btn" href="#products">
    View Collection
  </a>

</section>


<!-- PRODUCT COLLECTION -->
<section class="collection" id="products">

  <h2>Our Collection</h2>

  <div class="products">

    <!-- J-894 PRODUCT -->
    <div class="product">

      <img
        src="file_000000005e48211bac03ef53a051c50.png"
        alt="J-894 F/S Self JQD">

      <div class="product-info">

        <h3>J-894 F/S</h3>

        <p>
          <b>Item:</b> SELF JQD<br>
          <b>Size:</b> L, XL, XXL<br>
          <b>Colour:</b> 6<br>
          <b>Quantity:</b> 6
        </p>

        <a class="product-btn" href="#">
          View Product
        </a>

      </div>

    </div>

  </div>

</section>


<!-- CONTACT -->
<section class="collection" id="contact">

  <h2>Relaxgarments</h2>

  <p style="text-align:center;color:#555;">
    JACK & GETZED – Premium Fashion Brands
  </p>

</section>


<!-- FOOTER -->
<footer>
  © 2026 Relaxgarments. All Rights Reserved.
</footer>

</body>
</html>
